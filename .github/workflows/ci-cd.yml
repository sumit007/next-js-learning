# CI: SAST (CodeQL) + DAST (OWASP ZAP) + build on every push/PR to main
# CD: deploy `out/` to S3 on push to main (after build, SAST, and DAST pass)
#
# GitHub secrets (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#
# GitHub variables (Settings → Secrets and variables → Actions → Variables):
#   AWS_REGION              — e.g. us-east-1
#   S3_BUCKET               — bucket name (no s3:// prefix)
#   CLOUDFRONT_DISTRIBUTION_ID — optional; invalidates cache after deploy
#
# S3 bucket: enable static website hosting, or front with CloudFront.
# IAM policy needs s3:ListBucket, s3:GetObject, s3:PutObject, s3:DeleteObject on the bucket.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: out/
          retention-days: 1

  dast:
    name: DAST (OWASP ZAP)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download static site artifact
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: out/

      - name: Start static site server
        run: npx --yes serve@14 out -l 3000 &

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "Server ready at http://localhost:3000"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start"
          exit 1

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:3000
          token: ${{ secrets.GITHUB_TOKEN }}
          issue_title: DAST (OWASP ZAP) Baseline Report
          allow_issue_writing: true
          fail_action: true
          artifact_name: zap-dast-report

  deploy:
    name: Deploy to S3
    needs: [build, sast, dast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Download static site artifact
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: out/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync out/ "s3://${{ vars.S3_BUCKET }}/" --delete

      - name: Invalidate CloudFront cache
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
